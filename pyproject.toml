[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "tempregpy"
dynamic = ["version"]
description = "Temperature regulation optimization for hydropower operations"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "M. Pavicevic", email = "mpavicevic@anl.gov"},
    {name = "Q. Ploussard", email = "qploussard@anl.gov"},
]
maintainers = [
    {name = "Argonne National Laboratory Energy Modelling Hub"},
]
keywords = [
    "hydropower",
    "optimization",
    "temperature-regulation",
    "water-resources",
    "energy-systems",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "scipy>=1.7.0",
    "ortools>=9.14.0",
    "xlsxwriter>=3.0.0",
    "openpyxl>=3.0.0",
    "typer>=0.9.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
color = ["colorlog>=6.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "colorlog>=6.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/energy-modelling-hub/TempRegPy"
Documentation = "https://github.com/energy-modelling-hub/TempRegPy"
Repository = "https://github.com/energy-modelling-hub/TempRegPy"
Issues = "https://github.com/energy-modelling-hub/TempRegPy/issues"

[project.scripts]
tempregpy = "tempregpy.__main__:main"

[tool.setuptools]
packages = ["tempregpy", "tempregpy.model"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"
fallback_version = "0.2.4"
write_to = "tempregpy/_version.py"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/ (
    # directories
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)
/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "matplotlib.*",
    "ortools.*",
    "xlsxwriter.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["tempregpy"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ ==.__main__. :",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\) :",
    "@ (abc\\.)?abstractmethod",
]
