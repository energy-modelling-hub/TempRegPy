name: Build with Docker Container

on:
  push:
    branches: [ main, develop, 3-ci ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/build-env

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Debug image names
      run: |
        echo "Registry: ${{ env.REGISTRY }}"
        echo "Image name: ${{ env.IMAGE_NAME }}"
        echo "Full image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        echo "Generated tags: ${{ steps.meta.outputs.tags }}"

    - name: Check for Dockerfile changes
      id: dockerfile-check
      run: |
        if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E "(docker/|Dockerfile|\.dockerignore|requirements\.txt|package\.json|Pipfile|go\.mod|pom\.xml)"; then
          echo "dockerfile-changed=true" >> $GITHUB_OUTPUT
        else
          echo "dockerfile-changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./docker
        file: ./docker/Dockerfile
        load: true
        push: false
        tags: anl/winbuild:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Build repository using Docker container
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          anl/winbuild:latest \
          /bin/bash -c "
            echo 'Starting Wine build process...'

            cd /workspace

            # Run the Windows batch file using Wine
            wine docker/build.bat
            
            echo 'Build completed successfully!'
          "
    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: RunWAPASim
        path: ./dist/RunWAPASim.exe
    - name: Release
      uses: ncipollo/release-action@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        artifacts: ./dist/RunWAPASim.exe